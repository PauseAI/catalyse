# Local Postgres for development (`db`) and for tests (`db-test`). `docker compose up -d`, then
# point DATABASE_URL at `db` and TEST_DATABASE_URL at `db-test` (see .env.local.example). Pin
# the major version to what Railway runs in production.
#
# Host ports default to 5432/5433 and can be changed with DB_PORT / TEST_DB_PORT (e.g. in .env)
# if those are taken; keep DATABASE_URL / TEST_DATABASE_URL in step.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: catalyse
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      # 18+ images want the mount one level up; they create a versioned data dir inside it.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  # Throwaway server for the unit and e2e suites. Data lives in memory and durability is off,
  # which is only safe because nothing here outlives a restart. Never point DATABASE_URL at it.
  db-test:
    image: postgres:18
    command:
      ['postgres', '-c', 'fsync=off', '-c', 'synchronous_commit=off', '-c', 'full_page_writes=off']
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: catalyse_test
    ports:
      - '${TEST_DB_PORT:-5433}:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
