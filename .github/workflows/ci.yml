name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Fork PRs get a read-only token whatever is written here; this keeps in-repo branches on the
# same footing. Actions are pinned to commit SHAs so an upstream tag can't be moved under us,
# and `persist-credentials: false` keeps the token out of the checkout. zizmor enforces all of
# that in `static-checks`; `test/ci-workflow.test.ts` checks the project-specific rules it
# can't know about.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    env:
      # Never connected to: `prisma.config.ts` refuses to load without a URL, and the
      # generated client is needed for typecheck.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/catalyse
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Fails on any critical npm advisory, so a vulnerable dependency can't reach main unseen.
      - run: npm run audit:critical
      # Static security audit of this file: dangerous triggers, template injection, unpinned
      # actions, broad permissions, leaked credentials. Runs the digest-pinned zizmor image.
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true
          min-severity: low

  unit-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catalyse
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/catalyse
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      # Coverage must stay at 100% lines/statements (vitest.config.mts enforces it). The job
      # summary lists the uncovered lines even on failure, so a miss can be read from the run page.
      - name: Coverage summary
        if: always()
        run: npm run --silent coverage:report >> "$GITHUB_STEP_SUMMARY"

  e2e-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catalyse
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_URL: http://localhost:3000
      CRON_SECRET: ci-dummy-secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/catalyse
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
