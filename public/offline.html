<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f2937" media="(prefers-color-scheme: dark)" />
    <title>Catalyse | Offline</title>
    <!-- The app's theme choice, as the root layout applies it. -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        document.documentElement.setAttribute(
          'data-theme',
          t === 'dark' || t === 'light'
            ? t
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light',
        )
      } catch (e) {}
    </script>
    <style>
      /* Tokens from app/globals.css, which this page is served without; app/contrast.test.ts keeps them equal. */
      :root {
        --color-brand-bg: #fafafa;
        --color-surface: #ffffff;
        --color-brand-text: #1a202c;
        --color-text-light: #4a5568;
        --color-brand-border: #e2e8f0;
        --color-primary: #ff9416;
        --color-primary-text: #a85400;
      }
      [data-theme='dark'] {
        --color-brand-bg: #111827;
        --color-surface: #1f2937;
        --color-brand-text: #f3f4f6;
        --color-text-light: #9ca3af;
        --color-brand-border: #374151;
        --color-primary: #ffa633;
        --color-primary-text: #ffa633;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        background: var(--color-brand-bg);
        color: var(--color-brand-text);
        font-family: 'Roboto Slab', Georgia, serif;
      }
      main {
        max-width: 28rem;
        text-align: center;
        background: var(--color-surface);
        border: 1px solid var(--color-brand-border);
        border-radius: 12px;
        padding: 32px 24px;
      }
      h1 {
        font-family: 'Saira Condensed', 'Arial Narrow', sans-serif;
        font-size: 2rem;
        margin: 16px 0 8px;
      }
      p {
        color: var(--color-text-light);
        line-height: 1.5;
        margin: 0 0 24px;
      }
      a {
        display: inline-block;
        background: var(--color-primary);
        color: #1a202c;
        font-weight: 700;
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 8px;
      }
      a:focus-visible {
        outline: 3px solid var(--color-primary-text);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg width="64" height="64" viewBox="0 0 616 616" aria-hidden="true">
        <circle cx="308" cy="308" r="308" fill="#ff9416" />
        <rect x="194" y="176" width="77" height="274" rx="2" fill="#fff" />
        <rect x="339" y="176" width="77" height="274" rx="2" fill="#fff" />
      </svg>
      <h1>You're offline</h1>
      <p>Catalyse needs a connection. Check your signal or Wi-Fi, then try again.</p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
